name: Release

# Pushing a tag vX.Y.Z (matching the VERSION file), or running this workflow by hand on master, tests
# 7thDroid, builds its aarch64 AppImage and publishes it as a normal release v<VERSION>, which
# DroidDeck's "Add an app > GitHub" installs. Run by hand, the release also creates the tag.
# Run by hand on any other branch, whose VERSION must then be a SemVer pre-release (X.Y.Z-beta.1),
# it publishes a pre-release for testing instead, built as "7thDroid Canary" with a red icon so its
# DroidDeck tile is told apart from the release's. DroidDeck's GitHub install passes over pre-releases
# while a normal release is among the 15 newest, so delete old pre-releases after each release.
# A normal release's notes are its "## [X.Y.Z]" section of CHANGELOG.md, which must exist; a
# pre-release lists the commits since the last normal release.
# A pull request only tests and builds; its AppImage is kept as the run's artifact.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Droid-Deck/DroidDeck
          path: droiddeck
          sparse-checkout: tools/linuxfs/overlay/usr/local/bin
      - name: Lint
        run: shellcheck -x 7thdroid.sh packaging/AppRun tests/test_install.sh tests/stubs/droiddeck-proton-run tests/stubs/zenity tests/stubs/innoextract && shellcheck -s sh packaging/build-appimage.sh packaging/zenity
      - name: Unit tests
        run: DROIDDECK_SRC=$PWD/droiddeck python3 -m unittest discover -s tests
      - name: Installer tests
        run: DROIDDECK_SRC=$PWD/droiddeck bash tests/test_install.sh

  build:
    needs: test
    runs-on: ubuntu-24.04-arm
    container: ghcr.io/pkgforge-dev/archlinux:latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check VERSION fits the ref
        id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version=$(cat VERSION)
          echo "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' \
            || { echo "VERSION '$version' is not X.Y.Z or X.Y.Z-<pre-release>." >&2; exit 1; }
          case $version in *-*) prerelease=true ;; *) prerelease=false ;; esac
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match VERSION $version." >&2; exit 1; }
          elif [ "$EVENT" = workflow_dispatch ] && [ "$GITHUB_REF_NAME" = master ]; then
            [ "$prerelease" = false ] || { echo "master publishes normal releases; VERSION $version is a pre-release." >&2; exit 1; }
          elif [ "$EVENT" = workflow_dispatch ]; then
            [ "$prerelease" = true ] || { echo "A branch publishes pre-releases; set VERSION to $version-beta.1 or similar." >&2; exit 1; }
          fi
          # A normal release's notes are its CHANGELOG.md section.
          if [ "$prerelease" = false ] && { [ "$GITHUB_REF_TYPE" = tag ] || [ "$EVENT" = workflow_dispatch ]; }; then
            grep -qF "## [$version]" CHANGELOG.md 2>/dev/null \
              || { echo "CHANGELOG.md has no '## [$version]' section for this release." >&2; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - uses: pkgforge-dev/anylinux-setup-action@0964f2258d6c93d1391359978dde081fd8b3c6af # v2
      - name: Build the AppImage
        run: /bin/sh packaging/build-appimage.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: AppImage-aarch64
          path: dist/*.AppImage

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The whole history and its tags, for the release notes.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: AppImage-aarch64
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag=$GITHUB_REF_NAME; else tag=v$VERSION; fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump VERSION for a new one." >&2
            exit 1
          fi
          cat > notes.md <<'EOF'
          **7thDroid is experimental software, provided as is, without warranty of any kind. Use it at your own risk.**

          EOF
          extra=()
          if [ "$PRERELEASE" = true ]; then
            extra=(--prerelease)
            cat >> notes.md <<EOF
          **This is a pre-release for testing, built from \`$GITHUB_REF_NAME\`.** DroidDeck's **Add an app > GitHub** does not offer it.
          To try it, download the AppImage below and add it in DroidDeck with **Desktop > Add an app > AppImage**.
          It installs as a separate **7thDroid Canary** tile with a red icon. It shares 7th Heaven's install, settings and log with the 7thDroid tile.
          EOF
            # A pre-release lists the commits since the last normal release, without merges and VERSION bumps.
            base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' HEAD 2>/dev/null || true)
            {
              printf '\n## Changes%s\n\n' "${base:+ since $base}"
              git log --no-merges --format='- %s' ${base:+"$base..HEAD"} | grep -v '^- Version ' || true
            } >> notes.md
          else
            cat >> notes.md <<'EOF'
          Install it in DroidDeck: **Desktop > Add an app > GitHub**, then enter this repository's name.
          Open the new 7thDroid tile: its menu installs 7th Heaven, then launches, updates or uninstalls it and recreates its shortcuts.
          EOF
            # A normal release's notes are its CHANGELOG.md section (checked before the build).
            {
              printf '\n'
              awk -v head="## [$VERSION]" 'index($0, head) == 1 { found = 1 } found && /^## \[/ && index($0, head) != 1 { exit } found' CHANGELOG.md
            } >> notes.md
          fi
          gh release create "$tag" dist/*.AppImage --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "7thDroid $tag" --notes-file notes.md "${extra[@]}"
